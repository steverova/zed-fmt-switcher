name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            out: zed-fmt-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            out: zed-fmt-windows-x64.exe
          - os: macos-latest
            target: bun-darwin-arm64
            out: zed-fmt-darwin-arm64
          # arm64 / Intel macOS: build on a native runner so the OpenTUI
          # native library for that platform is installed and embedded.
          # - os: ubuntu-24.04-arm
          #   target: bun-linux-arm64
          #   out: zed-fmt-linux-arm64
          # - os: macos-13
          #   target: bun-darwin-x64
          #   out: zed-fmt-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build ${{ matrix.out }}
        run: bun build --compile --target=${{ matrix.target }} --outfile ${{ matrix.out }} ./src/index.tsx

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
